# 友质科技官网 —— nginx 配置
#
# 与 vercel.json 保持一致：同样的页面查找规则（预渲染的 *.html、未知地址 404）和同样的 6 项安全响应头。
# 两边行为必须对齐，否则双域名部署会出现「一个站好用、另一个报错」的问题。
# tests/nginx-config.test.js 会逐条比对这里和 vercel.json 的安全头。
#
# 部署位置：/etc/nginx/sites-available/youzhi.conf
#          并软链到 /etc/nginx/sites-enabled/

# 缓存策略按路径取值，而不是在各个 location 里写 add_header：
# location 里只要出现一条 add_header，就不再继承 server 级的全部 add_header，
# 之前 /assets/ 里单独加了 Cache-Control，JS/CSS 响应上的 6 项安全头因此全丢了。
# 本文件被 include 在 http 块内，所以 map 可以写在这里；变量名带前缀，避免与其它站点冲突。
map $uri $youzhi_cache_control {
    # 带哈希的构建产物，内容一变文件名就变，可以长期缓存
    ~^/assets/  "public, max-age=31536000, immutable";
    # API 的缓存由 Node 服务自己决定，空值表示 nginx 不加这个头
    ~^/api/     "";
    # 其余（index.html、图片、sitemap）与 Vercel 默认一致：每次回源校验。
    # index.html 尤其不能被缓存，否则发版后浏览器拿旧页面去请求已删除的旧 chunk。
    default     "public, max-age=0, must-revalidate";
}

server {
    listen 80;
    listen [::]:80;
    server_name youzhiyes.com www.youzhiyes.com;

    # certbot 申请证书时的验证路径，必须在跳转之前
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.youzhiyes.com$request_uri;
    }
}

server {
    # http2 写在 listen 上，而不是单独一行 `http2 on;`：后者要求 nginx ≥ 1.25.1，
    # Ubuntu 22.04 / 24.04 apt 源里分别是 1.18 / 1.24，会直接报 unknown directive。
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name youzhiyes.com www.youzhiyes.com;

    ssl_certificate     /etc/letsencrypt/live/youzhiyes.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/youzhiyes.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    # 裸域跳 www，与 Vercel 现有行为一致
    if ($host = youzhiyes.com) {
        return 301 https://www.youzhiyes.com$request_uri;
    }

    root /opt/youzhi/dist;
    index index.html;

    # ===== 安全响应头（与 vercel.json 逐条对应）=====
    # 只能写在 server 级，下面的 location 里不要再出现 add_header，原因见文件顶部 map 的注释
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    # 不带 always：404 等错误响应不该被标成长期缓存
    add_header Cache-Control $youzhi_cache_control;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 构建产物缺失时直接 404，不回退到 index.html：
    # 否则发版后对旧 chunk 的请求会拿到一份 HTML，浏览器按 JS 解析，报错难以排查
    location /assets/ {
        try_files $uri =404;
    }

    # API 转发到本机 Node 服务
    # 必须透传 Host 和真实 IP —— guard.js 依赖它们做同源校验和限流
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # 页面都是构建时预渲染好的静态 HTML（scripts/prerender.mjs）：
    #   /                       → index.html
    #   /products               → products.html
    #   /products/zspace-z425   → products/zspace-z425.html
    # 真实存在的文件（robots.txt、sitemap.xml、图片）优先返回自身，其次是 $uri.html。
    # 只检查文件、不检查目录（不写 $uri/）：public/products/ 放的是产品图，
    # 检查目录的话 /products 会命中这个目录，301 到 /products/ 再 403，产品页打不开。
    #
    # 都不存在的地址返回 404.html 并带 404 状态码，搜索引擎不会把它当成正常页面收录。
    # 注意：这份配置依赖构建产物里有 *.html，必须先部署新版 dist 再换配置；
    # 反过来（新配置 + 旧产物）所有子页面都会 404。
    # 首页单独一条：try_files 只认文件，"/" 是目录，走下面的规则会落到 404
    location = / {
        try_files /index.html =404;
    }

    location / {
        # /products/ 这类尾斜杠地址统一跳到不带斜杠的规范地址
        rewrite ^(/.+)/$ $1 permanent;
        try_files $uri $uri.html =404;
        error_page 404 /404.html;
    }
}
