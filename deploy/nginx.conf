# 友质科技官网 —— nginx 配置
#
# 与 vercel.json 保持一致：同样的 SPA 回退规则和同样的 6 项安全响应头。
# 两边行为必须对齐，否则双域名部署会出现「一个站好用、另一个报错」的问题。
#
# 部署位置：/etc/nginx/sites-available/youzhi.conf
#          并软链到 /etc/nginx/sites-enabled/

server {
    listen 80;
    listen [::]:80;
    server_name youzhiyes.com www.youzhiyes.com;

    # certbot 申请证书时的验证路径，必须在跳转之前
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.youzhiyes.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name youzhiyes.com www.youzhiyes.com;

    ssl_certificate     /etc/letsencrypt/live/youzhiyes.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/youzhiyes.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    # 裸域跳 www，与 Vercel 现有行为一致
    if ($host = youzhiyes.com) {
        return 301 https://www.youzhiyes.com$request_uri;
    }

    root /opt/youzhi/dist;
    index index.html;

    # ===== 安全响应头（与 vercel.json 逐条对应）=====
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 带哈希的构建产物可以长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API 转发到本机 Node 服务
    # 必须透传 Host 和真实 IP —— guard.js 依赖它们做同源校验和限流
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # SPA 回退，等价于 vercel.json 的 rewrites
    # 注意：真实存在的文件（robots.txt、sitemap.xml、图片）优先返回自身
    location / {
        try_files $uri $uri/ /index.html;
    }
}
