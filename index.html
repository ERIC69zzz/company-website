<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- .ico 放在前面作为兜底：浏览器默认会去请求 /favicon.ico，
         支持 SVG 的浏览器仍会优先用下面那条矢量图标。 -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 百度：声明同一套页面自适应电脑与手机，并禁止移动搜索对页面转码 -->
    <meta name="applicable-device" content="pc,mobile" />
    <meta http-equiv="Cache-Control" content="no-transform" />
    <meta http-equiv="Cache-Control" content="no-siteapp" />
    <!-- 百度搜索资源平台的站点归属验证（www.youzhiyes.com）。
         验证通过后也不能删：百度会定期复查，删掉即失去站点权限。 -->
    <meta name="baidu-site-verification" content="codeva-kNHq0AlOyL" />
    <meta name="description" content="北京友质科技有限公司 - 专注硬盘与NAS私有云存储解决方案，成立于2010年，为您提供企业级数据存储产品与服务。" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="canonical" href="%SITE_URL%/" />
    <title>北京友质科技有限公司 - 硬盘与NAS私有云存储专家</title>

    <!-- 分享卡片：微信、钉钉、微博等抓取的是静态 HTML，不执行 JS，因此是中文版本。
         这里是首页的值；其余页面的 title、description、canonical、og 由构建时的
         scripts/prerender.mjs 按页替换。 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="北京友质科技有限公司" />
    <meta property="og:locale" content="zh_CN" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:title" content="北京友质科技有限公司 - 硬盘与NAS私有云存储专家" />
    <meta property="og:description" content="北京友质科技有限公司 - 专注硬盘与NAS私有云存储解决方案，成立于2010年，为您提供企业级数据存储产品与服务。" />
    <meta property="og:image" content="%SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="友质科技标识" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="北京友质科技有限公司 - 硬盘与NAS私有云存储专家" />
    <meta name="twitter:description" content="北京友质科技有限公司 - 专注硬盘与NAS私有云存储解决方案，成立于2010年，为您提供企业级数据存储产品与服务。" />
    <meta name="twitter:image" content="%SITE_URL%/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
