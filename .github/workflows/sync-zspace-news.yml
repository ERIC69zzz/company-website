name: 同步极空间新闻

on:
  schedule:
    # 每周一 09:00（北京时间），UTC 01:00
    - cron: '0 1 * * 1'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # 下面要用 workflow_dispatch 触发阿里云部署
      actions: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: 抓取最新新闻
        run: node scripts/fetch-zspace-news.js

      - name: 提交变更并推送
        run: |
          if git diff --quiet src/data/zspace-news.json; then
            echo "新闻无更新，跳过提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/zspace-news.json
          git commit -m "chore: 自动同步极空间新闻"
          git push

          # 用 GITHUB_TOKEN 推送的提交不会触发任何 push 类 workflow（GitHub 防递归），
          # 所以「部署到阿里云 ECS」不会自己跑：Vercel 有自己的 Git 集成照常更新，
          # youzhiyes.com 却一直停在旧新闻。workflow_dispatch 是例外，可以显式触发。
          gh workflow run deploy-ecs.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
